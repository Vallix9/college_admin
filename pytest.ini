[pytest]
testpaths = tests
# Только test_*.py: файлы phase*_test.py тоже подходят под шаблон
# *_test.py, а в них main() вызывается на верхнем уровне — pytest
# импортировал бы их и выполнил целый прогон фазы вместо теста.
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning